# LiveShow production Nginx (single VPS)
#
# Replace every YOUR_DOMAIN with the apex host from docs/ops-inventory.md
# (example: liveshow.hu). Then:
#   api.YOUR_DOMAIN  → NestJS  127.0.0.1:3200
#   live.YOUR_DOMAIN → LiveKit SFU  127.0.0.1:7880 (WSS)
#   YOUR_DOMAIN + www.YOUR_DOMAIN → Next.js 127.0.0.1:3000
#
# Copy to: /etc/nginx/sites-available/liveshow
# Enable:  ln -s /etc/nginx/sites-available/liveshow /etc/nginx/sites-enabled/liveshow
#          rm -f /etc/nginx/sites-enabled/default
#
# TLS files come from one Let's Encrypt certificate that covers
# YOUR_DOMAIN, www.YOUR_DOMAIN, api.YOUR_DOMAIN, and live.YOUR_DOMAIN
# (see docs/ssl-setup.md). Do not invent a second live/ directory name.
#
# UDP: LiveKit RTC 50000-50050 and TURN 3478 are NOT in this file.
# Open them with deploy/livekit/ufw-livekit.sh. Do not publish 3000, 3200, or 7880.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream liveshow_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream liveshow_api {
    server 127.0.0.1:3200;
    keepalive 16;
}

upstream liveshow_livekit {
    server 127.0.0.1:7880;
    keepalive 8;
}

# --- ACME HTTP-01 (must stay on :80 after HTTPS is on) ---

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN api.YOUR_DOMAIN live.YOUR_DOMAIN;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Site: Next.js (browser origin). /api → Nest (not Next rewrite; VOD > 10 MB) ---

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # VOD upload is 2 GB (vod-multer). Browser posts through this host (/api/...).
    client_max_body_size 2048m;
    client_body_timeout 600s;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/barion/ {
        proxy_pass http://liveshow_api/api/barion/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /api/ {
        proxy_pass http://liveshow_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://liveshow_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 600s;
    }
}

# --- API: NestJS. HLS /output, uploads, health, Barion webhook, Socket.IO ---

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 2048m;
    client_body_timeout 600s;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # HLS + archive: do not buffer; playlists must not be cached.
    location ^~ /output/ {
        proxy_pass http://liveshow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        proxy_pass http://liveshow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 600s;
    }
}

# --- LiveKit SFU signaling (WSS). Media UDP is not proxied. ---

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name live.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://liveshow_livekit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
