port: 7880
bind_addresses:
  - ""
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50050
  use_external_ip: true

# Replace both values with `livekit-server generate-keys` output.
# Nest LIVEKIT_API_KEY / LIVEKIT_API_SECRET must match.
keys:
  LIVEKIT_API_KEY_PLACEHOLDER: LIVEKIT_API_SECRET_PLACEHOLDER

turn:
  enabled: true
  domain: live.YOUR_DOMAIN
  udp_port: 3478
  tls_port: 5349
  cert_file: /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
  key_file: /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem
